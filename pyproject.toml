[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sahayak-silent-zone-detection"
version = "1.0.0"
description = "Autonomous Triple-Engine Disaster Intelligence, Silent Zone Detection, and Shelter Resource Redistribution System for India"
readme = "README.md"
authors = [
    { name = "Rishikesh Singh", email = "singhrishikesh1@users.noreply.github.com" },
    { name = "Hiya Shaikh", email = "hiyashaikh16@users.noreply.github.com" },
]
maintainers = [
    { name = "Rishikesh Singh", email = "singhrishikesh1@users.noreply.github.com" },
    { name = "Hiya Shaikh", email = "hiyashaikh16@users.noreply.github.com" },
]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "streamlit>=1.32.0",
    "folium>=0.16.0",
    "streamlit-folium>=0.18.0",
    "scikit-learn>=1.4.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "joblib>=1.3.2",
    "shap>=0.45.0",
]

[project.urls]
Homepage = "https://github.com/singhrishikesh1/sahayak-silent-zone"
Repository = "https://github.com/singhrishikesh1/sahayak-silent-zone.git"
"Bug Tracker" = "https://github.com/singhrishikesh1/sahayak-silent-zone/issues"
